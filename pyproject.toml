[project]
name = "columnar-constructive-networks"
version = "0.1.0"
description = "Scalable Real-Time Recurrent Learning Using Columnar-Constructive Networks (JMLR 2024) - Python port"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
experiments = ["torch==2.7.1", "matplotlib>=3.9"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
